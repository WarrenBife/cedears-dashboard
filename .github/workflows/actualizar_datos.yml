name: Actualizar datos.json

on:
  workflow_dispatch:         # única forma de disparar esta corrida (2026-09-16).
                              # El cron nativo de GitHub (schedule:) se sacó por
                              # completo -- venía atrasando horas la corrida de
                              # cierre (19:46 ART en vez de 17:00/17:45) y el
                              # 16/9 directamente no disparó ninguna. Ahora un
                              # servicio externo (cron-job.org) llama a este
                              # mismo workflow_dispatch 4 veces por día hábil
                              # (mediodía x2 con cierre=false, cierre x2 con
                              # cierre=true) a horario exacto. También sirve
                              # para correrlo a mano desde GitHub cuando haga
                              # falta.
    inputs:
      cierre:
        description: 'Tratar esta corrida como la corrida de CIERRE (para el disparador externo, o para forzarla a mano)'
        required: false
        default: 'false'

jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      # Verdadero si es la corrida de cierre -- ahora que no hay cron nativo
      # (2026-09-16), depende únicamente del input inputs.cierre=true que
      # manda el disparador externo (o una corrida manual a mano).
      ES_CIERRE: ${{ github.event.inputs.cierre == 'true' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy requests gspread google-auth gspread-formatting

      - name: Ejecutar Colab script
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          # RUN_SCHEDULE solo necesita ser un string NO VACÍO para que
          # es_corrida_cierre() en actualizar_datos.py lo tome como cierre
          # (ese chequeo además exige que la hora UTC real sea 20 -- por eso
          # el disparador externo tiene que disparar la corrida de cierre
          # dentro de la ventana 20:00-20:59 UTC).
          RUN_SCHEDULE: ${{ env.ES_CIERRE == 'true' && 'external-cierre' || '' }}
        run: python actualizar_datos.py

      - name: Setup Node
        if: env.ES_CIERRE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Ranking Top 20/30 del Warren Score para el panel "Retorno Top 10"
      # (2026-09-14) -- solo en la corrida de CIERRE (17:00 ARG / 20:00 UTC,
      # mismo criterio que datos_lunes_cierre.json más abajo en el propio
      # script de Python), para tener una sola foto por rueda. Lee el
      # datos.json que acaba de escribir el paso de arriba en este mismo
      # checkout -- no hace falta bajarlo de nuevo.
      - name: Ranking diario Top 20/30 (Retorno Top 10 del Warren Score)
        if: env.ES_CIERRE == 'true'
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: node wb_top20_historia.js
