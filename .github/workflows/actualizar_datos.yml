name: Actualizar datos.json

on:
  schedule:
    - cron: '0 13-22 * * 1-5'  # cada hora de 10:00 a 19:00 Argentina (13:00-22:00 UTC)
  workflow_dispatch:         # permite correrlo manualmente desde GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy requests gspread google-auth gspread-formatting

      - name: Ejecutar Colab script
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python actualizar_datos.py
