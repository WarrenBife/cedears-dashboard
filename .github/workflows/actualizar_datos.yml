name: Actualizar datos.json

on:
  schedule:
    - cron: '0 13 * * 1-5'  # 10:00 Argentina (UTC-3) = 13:00 UTC
    - cron: '0 21 * * 1-5'  # 18:00 Argentina (UTC-3) = 21:00 UTC
  workflow_dispatch:         # permite correrlo manualmente desde GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install yfinance pandas numpy requests

      - name: Ejecutar Colab script
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python actualizar_datos.py
