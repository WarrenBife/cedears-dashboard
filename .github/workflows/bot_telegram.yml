name: Bot Telegram - Alerta Diaria

on:
  schedule:
    # Lunes a viernes 20:30hs Argentina (23:30 UTC)
    - cron: '30 23 * * 1-5'
  workflow_dispatch:  # Permite ejecutar manualmente

jobs:
  enviar-alerta:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Enviar alerta diaria
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot_telegram.py --alerta
