name: Bot Telegram - Alerta Diaria

on:
  schedule:
    - cron: '30 23 * * 1-5'  # 20:30 Argentina (UTC-3) = 23:30 UTC, lunes a viernes
  workflow_dispatch:          # permite correrlo manualmente desde GitHub

jobs:
  alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pytz

      - name: Enviar alerta diaria
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot_telegram.py --alerta
